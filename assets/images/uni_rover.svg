<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#1b2a47"/>
    </linearGradient>
    <pattern id="gridRover" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(99,102,241,0.2)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgRover)"/>
  <rect width="100%" height="100%" fill="url(#gridRover)"/>

  <text x="30" y="40" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">UNIVERSITY TEAM CHALLENGE // AUTONOMOUS SEARCH &amp; RESCUE ROVER</text>
  <text x="590" y="40" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">ROLE: LEAD CAD &amp; FABRICATION</text>
  <line x1="30" y1="50" x2="770" y2="50" stroke="rgba(129,140,248,0.2)" stroke-width="1"/>

  <!-- Rocker-Bogie Rover Schematic -->
  <g transform="translate(400, 240)">
    <!-- Rocker Arm & Bogie Linkages -->
    <path d="M -160 80 L -80 0 L 0 -40 L 80 0 L 160 80" fill="none" stroke="#818cf8" stroke-width="4"/>
    <path d="M -80 0 L -120 80" fill="none" stroke="#818cf8" stroke-width="4"/>
    <path d="M 80 0 L 120 80" fill="none" stroke="#818cf8" stroke-width="4"/>

    <!-- Differential Pivot -->
    <circle cx="0" cy="-40" r="12" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="-40" r="4" fill="#f59e0b"/>

    <!-- Main Electronics & Sensor Deck (SolidWorks CAD Chassis) -->
    <rect x="-100" y="-120" width="200" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-80" y="-105" width="60" height="40" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="-72" y="-80" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">ARDUINO</text>
    <rect x="0" y="-105" width="80" height="40" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="8" y="-80" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">BATTERY 12V</text>

    <!-- Mast / Ultrasonic & IMU Sensor Mount -->
    <line x1="0" y1="-120" x2="0" y2="-160" stroke="#818cf8" stroke-width="3"/>
    <rect x="-25" y="-180" width="50" height="20" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="-12" cy="-170" r="5" fill="#38bdf8"/>
    <circle cx="12" cy="-170" r="5" fill="#38bdf8"/>
    <text x="-45" y="-190" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">ULTRASONIC ARRAY</text>

    <!-- Wheels (6-Wheel Drive High Traction) -->
    <!-- Wheel 1 -->
    <g transform="translate(-160, 80)">
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
      <circle cx="0" cy="0" r="14" fill="#334155"/>
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#f59e0b" stroke-width="2"/>
    </g>
    <!-- Wheel 2 -->
    <g transform="translate(-120, 80)">
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
      <circle cx="0" cy="0" r="14" fill="#334155"/>
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#f59e0b" stroke-width="2"/>
    </g>
    <!-- Wheel 3 -->
    <g transform="translate(120, 80)">
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
      <circle cx="0" cy="0" r="14" fill="#334155"/>
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#f59e0b" stroke-width="2"/>
    </g>
    <!-- Wheel 4 -->
    <g transform="translate(160, 80)">
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
      <circle cx="0" cy="0" r="14" fill="#334155"/>
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#f59e0b" stroke-width="2"/>
    </g>
  </g>

  <!-- Obstacle Terrain Incline Slope -->
  <path d="M 100 370 L 320 370 L 680 290 L 750 290" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="560" y="325" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11">20° OBSTACLE INCLINE</text>

  <rect x="30" y="445" width="280" height="28" rx="4" fill="rgba(129,140,248,0.1)" stroke="#818cf8" stroke-width="1"/>
  <text x="40" y="463" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11">✓ MULTIDISCIPLINARY TEAMWORK &amp; RAPID PROTOTYPING</text>
</svg>
