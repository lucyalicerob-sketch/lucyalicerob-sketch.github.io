<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="streamlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgWind)"/>

  <text x="30" y="40" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">EXPERIMENTAL FLUID MECHANICS // SUBSONIC WIND TUNNEL &amp; BOUNDARY LAYER</text>
  <text x="590" y="40" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">PYTHON DATA PROCESSING</text>
  <line x1="30" y1="50" x2="770" y2="50" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>

  <!-- Airfoil / Bluff Body in Test Section -->
  <g transform="translate(380, 240)">
    <!-- NACA 0012 Airfoil Profile -->
    <path d="M -160 0 C -120 -60, 40 -40, 160 0 C 40 15, -120 20, -160 0 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Pressure Tap Sensor Ports -->
    <circle cx="-100" cy="-25" r="3" fill="#f59e0b"/>
    <circle cx="-50" cy="-35" r="3" fill="#f59e0b"/>
    <circle cx="0" cy="-32" r="3" fill="#f59e0b"/>
    <circle cx="50" cy="-20" r="3" fill="#f59e0b"/>
    <circle cx="100" cy="-8" r="3" fill="#f59e0b"/>
    <text x="-50" y="-55" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">PITOT-STATIC PRESSURE TAPS</text>

    <!-- Airflow Streamlines -->
    <path d="M -300 -120 C -150 -120, -50 -140, 80 -130 C 200 -120, 300 -110, 380 -110" fill="none" stroke="url(#streamlineGrad)" stroke-width="2" opacity="0.8"/>
    <path d="M -300 -60 C -160 -60, -90 -85, 0 -70 C 100 -55, 250 -40, 380 -40" fill="none" stroke="url(#streamlineGrad)" stroke-width="2.5" opacity="0.9"/>
    <path d="M -300 60 C -160 60, -90 60, 0 50 C 100 45, 250 40, 380 40" fill="none" stroke="url(#streamlineGrad)" stroke-width="2.5" opacity="0.9"/>
    <path d="M -300 120 C -150 120, -50 110, 80 110 C 200 110, 300 110, 380 110" fill="none" stroke="url(#streamlineGrad)" stroke-width="2" opacity="0.8"/>

    <!-- Boundary Layer Velocity Profile Graph Overlay -->
    <g transform="translate(190, -110)">
      <line x1="0" y1="0" x2="0" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="0" y1="90" x2="80" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M 0 90 C 20 85, 65 50, 75 0" fill="none" stroke="#10b981" stroke-width="2"/>
      <text x="10" y="105" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">u(y) BOUNDARY LAYER</text>
    </g>
  </g>

  <rect x="30" y="445" width="280" height="28" rx="4" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="1"/>
  <text x="40" y="463" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">✓ EXPERIMENTAL UNCERTAINTY ±2.4%</text>
</svg>
