<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTurntable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a111a"/>
      <stop offset="100%" stop-color="#162233"/>
    </linearGradient>
    <linearGradient id="slewRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <pattern id="cadGrid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(56,189,248,0.2)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgTurntable)"/>
  <rect width="100%" height="100%" fill="url(#cadGrid3)"/>

  <text x="30" y="40" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">MECHANISM DESIGN // RIDE VEHICLE ROTARY TURNTABLE</text>
  <text x="590" y="40" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">IN-PROGRESS SOLIDWORKS BUILD</text>
  <line x1="30" y1="50" x2="770" y2="50" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>

  <!-- Turntable Isometric / Top-Down Slew Ring Mechanism -->
  <g transform="translate(400, 250)">
    <!-- Outer Base Ring -->
    <circle cx="0" cy="0" r="170" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    
    <!-- Slewing Bearing Gear Teeth Ring -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="url(#slewRingGrad)" stroke-width="12" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="130" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>

    <!-- Rotating Track Deck Section -->
    <g transform="rotate(28)">
      <rect x="-140" y="-35" width="280" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <!-- Track Rails on Turntable -->
      <line x1="-135" y1="-20" x2="135" y2="-20" stroke="#f59e0b" stroke-width="5"/>
      <line x1="-135" y1="20" x2="135" y2="20" stroke="#f59e0b" stroke-width="5"/>
      <!-- Rotation Direction Arrow -->
      <path d="M -110 -60 A 120 120 0 0 1 110 -60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3"/>
      <polygon points="115,-55 125,-68 108,-68" fill="#38bdf8"/>
    </g>

    <!-- Pinion Drive Motor Unit -->
    <g transform="translate(-145, -80)">
      <rect x="-30" y="-30" width="60" height="60" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="3 3"/>
      <text x="-120" y="-40" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">PLANETARY GEAR MOTOR</text>
      <text x="-120" y="-25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">HIGH TORQUE PINION DRIVE</text>
    </g>

    <!-- Fail-Safe Pneumatic Shot-Pin Lock 1 -->
    <g transform="translate(160, 0)">
      <rect x="0" y="-14" width="45" height="28" rx="4" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
      <polygon points="0,-8 -16,0 0,8" fill="#fbbf24"/>
      <text x="55" y="4" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="10">FAIL-SAFE SHOT-PIN</text>
      <text x="55" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">TAPERED LOCKING BUSHING</text>
    </g>

    <!-- Fail-Safe Pneumatic Shot-Pin Lock 2 (Opposite) -->
    <g transform="translate(-160, 0)">
      <rect x="-45" y="-14" width="45" height="28" rx="4" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
      <polygon points="0,-8 16,0 0,8" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Spec Badges -->
  <rect x="30" y="445" width="280" height="28" rx="4" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="1"/>
  <text x="40" y="463" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">✓ HARDWARE INTERLOCK REPEATABILITY ±0.5mm</text>
</svg>
