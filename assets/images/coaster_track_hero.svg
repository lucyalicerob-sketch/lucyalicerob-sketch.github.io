<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e04733"/>
      <stop offset="50%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e04733"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e04733" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Support Columns (Theme Park Steel Supports) -->
  <g stroke="#d6c7b6" stroke-width="4" opacity="0.4">
    <line x1="120" y1="260" x2="120" y2="400"/>
    <line x1="280" y1="120" x2="280" y2="400"/>
    <line x1="480" y1="210" x2="480" y2="400"/>
    <line x1="720" y1="90" x2="720" y2="400"/>
    <line x1="940" y1="240" x2="940" y2="400"/>
    <line x1="1100" y1="160" x2="1100" y2="400"/>
    
    <!-- Cross Bracing -->
    <line x1="280" y1="220" x2="350" y2="400"/>
    <line x1="720" y1="180" x2="650" y2="400"/>
    <line x1="720" y1="220" x2="790" y2="400"/>
  </g>

  <!-- Coaster Cross-Ties (Sleeping Ties between rails) -->
  <g stroke="#d35400" stroke-width="3" opacity="0.7">
    <!-- Lift Crest -->
    <line x1="60" y1="290" x2="60" y2="310"/>
    <line x1="120" y1="250" x2="120" y2="270"/>
    <line x1="180" y1="190" x2="180" y2="210"/>
    <line x1="240" y1="135" x2="240" y2="155"/>
    <line x1="280" y1="110" x2="280" y2="130"/>
    
    <!-- First Drop -->
    <line x1="330" y1="130" x2="340" y2="150"/>
    <line x1="380" y1="170" x2="390" y2="190"/>
    <line x1="430" y1="220" x2="440" y2="240"/>
    <line x1="480" y1="250" x2="480" y2="270"/>
    
    <!-- Camelback Airtime Hill -->
    <line x1="550" y1="220" x2="550" y2="240"/>
    <line x1="630" y1="140" x2="630" y2="160"/>
    <line x1="720" y1="80" x2="720" y2="100"/>
    <line x1="810" y1="140" x2="810" y2="160"/>
    <line x1="890" y1="230" x2="890" y2="250"/>
    
    <!-- Turn & Dive -->
    <line x1="970" y1="260" x2="970" y2="280"/>
    <line x1="1040" y1="210" x2="1040" y2="230"/>
    <line x1="1110" y1="150" x2="1110" y2="170"/>
    <line x1="1170" y1="120" x2="1170" y2="140"/>
  </g>

  <!-- Main Center Backbone Spine -->
  <path d="M 0,330 C 150,300 220,120 280,120 C 340,120 400,260 480,260 C 560,260 640,90 720,90 C 800,90 860,280 940,280 C 1020,280 1080,150 1200,100" 
        fill="none" stroke="#b03a2e" stroke-width="8" opacity="0.6"/>

  <!-- Upper Tubular Running Rail -->
  <path d="M 0,320 C 150,290 220,110 280,110 C 340,110 400,250 480,250 C 560,250 640,80 720,80 C 800,80 860,270 940,270 C 1020,270 1080,140 1200,90" 
        fill="none" stroke="url(#trackGrad)" stroke-width="5" filter="url(#glow)"/>

  <!-- Lower Tubular Running Rail -->
  <path d="M 0,340 C 150,310 220,130 280,130 C 340,130 400,270 480,270 C 560,270 640,100 720,100 C 800,100 860,290 940,290 C 1020,290 1080,160 1200,110" 
        fill="none" stroke="url(#trackGrad)" stroke-width="5" filter="url(#glow)"/>

  <!-- Animated Coaster Car Train (SVG Animated along path) -->
  <g>
    <!-- Train 1 on the crest -->
    <rect x="705" y="62" width="30" height="14" rx="4" fill="#e04733" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="712" cy="78" r="4" fill="#2c3e50" stroke="#f39c12" stroke-width="1.5"/>
    <circle cx="728" cy="78" r="4" fill="#2c3e50" stroke="#f39c12" stroke-width="1.5"/>
    <!-- Passenger Seats -->
    <circle cx="715" cy="67" r="2.5" fill="#f39c12"/>
    <circle cx="725" cy="67" r="2.5" fill="#f39c12"/>
    
    <!-- Motion Speed Lines -->
    <line x1="680" y1="65" x2="698" y2="65" stroke="#f39c12" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="675" y1="70" x2="695" y2="70" stroke="#e04733" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
</svg>
