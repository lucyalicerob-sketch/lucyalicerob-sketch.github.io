<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#1b202c"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#dbBg)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="760" height="460" rx="10" fill="#181d28" stroke="#333d52" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="20" y="20" width="760" height="55" rx="10" fill="#202636" stroke="#333d52" stroke-width="1"/>
  <text x="45" y="52" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">TRANSIT INFRASTRUCTURE LUX LEVEL DATABASE &amp; DASHBOARD</text>
  <rect x="630" y="34" width="130" height="26" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="642" y="51" fill="#38bdf8" font-family="'Space Mono', monospace" font-size="10" font-weight="700">EXCEL // E&amp;M</text>

  <!-- Left: Interactive Filter & Summary KPI Cards -->
  <g transform="translate(45, 95)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="200" height="75" rx="6" fill="#242b3d" stroke="#3b4660"/>
    <text x="14" y="24" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="10">TOTAL SURVEY POINTS</text>
    <text x="14" y="54" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">1,420</text>
    <text x="90" y="54" fill="#10b981" font-family="'Space Mono', monospace" font-size="11">✓ 98.4% PASS</text>

    <!-- KPI 2 -->
    <rect x="0" y="90" width="200" height="75" rx="6" fill="#242b3d" stroke="#3b4660"/>
    <text x="14" y="114" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="10">AVG ILLUMINANCE</text>
    <text x="14" y="144" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">248 Lux</text>
    <text x="125" y="144" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="10">(Target: 200)</text>

    <!-- KPI 3 -->
    <rect x="0" y="180" width="200" height="170" rx="6" fill="#242b3d" stroke="#3b4660"/>
    <text x="14" y="204" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="10">DYNAMIC FILTERS</text>
    
    <rect x="14" y="218" width="172" height="26" rx="4" fill="#181d28" stroke="#475569"/>
    <text x="24" y="235" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Zone: Maintenance Bays ▼</text>
    
    <rect x="14" y="254" width="172" height="26" rx="4" fill="#181d28" stroke="#475569"/>
    <text x="24" y="271" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Compliance: BS EN 12464 ▼</text>
    
    <rect x="14" y="290" width="172" height="42" rx="4" fill="#134e4a" stroke="#10b981"/>
    <text x="24" y="308" fill="#a7f3d0" font-family="'Space Mono', monospace" font-size="10" font-weight="700">STATUS: COMPLIANT</text>
    <text x="24" y="324" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Uniformity Ratio: U0 = 0.68</text>
  </g>

  <!-- Right: Lux Heatmap & Distribution Chart -->
  <g transform="translate(275, 95)">
    <!-- Chart Box -->
    <rect x="0" y="0" width="480" height="350" rx="6" fill="#242b3d" stroke="#3b4660"/>
    <text x="20" y="26" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Photometric Lux Distribution &amp; Uniformity Profile</text>
    <text x="20" y="44" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="10">AUTOMATED EXCEL VBA / FORMULA ENGINE</text>

    <!-- Grid / Chart Graphic -->
    <line x1="40" y1="280" x2="440" y2="280" stroke="#475569" stroke-width="1"/>
    <line x1="40" y1="70" x2="40" y2="280" stroke="#475569" stroke-width="1"/>

    <!-- Horizontal Gridlines -->
    <line x1="40" y1="220" x2="440" y2="220" stroke="#333d52" stroke-dasharray="3,3"/>
    <text x="14" y="224" fill="#64748b" font-family="'Space Mono', monospace" font-size="9">100</text>
    
    <line x1="40" y1="160" x2="440" y2="160" stroke="#333d52" stroke-dasharray="3,3"/>
    <text x="14" y="164" fill="#64748b" font-family="'Space Mono', monospace" font-size="9">200</text>
    
    <line x1="40" y1="100" x2="440" y2="100" stroke="#333d52" stroke-dasharray="3,3"/>
    <text x="14" y="104" fill="#64748b" font-family="'Space Mono', monospace" font-size="9">300</text>

    <!-- Target Line -->
    <line x1="40" y1="160" x2="440" y2="160" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="310" y="152" fill="#ef4444" font-family="'Space Mono', monospace" font-size="9" font-weight="700">MIN STANDARD (200 LUX)</text>

    <!-- Lux Curve Fill -->
    <path d="M 40,240 Q 100,110 160,120 T 260,110 T 360,130 T 440,150 L 440,280 L 40,280 Z" fill="rgba(245,158,11,0.15)"/>
    <path d="M 40,240 Q 100,110 160,120 T 260,110 T 360,130 T 440,150" fill="none" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- Sample Data Points -->
    <circle cx="100" cy="125" r="4" fill="#f59e0b"/>
    <circle cx="160" cy="120" r="4" fill="#f59e0b"/>
    <circle cx="210" cy="112" r="4" fill="#10b981"/>
    <circle cx="260" cy="110" r="4" fill="#10b981"/>
    <circle cx="310" cy="118" r="4" fill="#10b981"/>
    <circle cx="360" cy="130" r="4" fill="#f59e0b"/>
    <circle cx="410" cy="142" r="4" fill="#f59e0b"/>

    <!-- Bottom Legend -->
    <text x="80" y="310" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="9">BAY 1</text>
    <text x="180" y="310" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="9">BAY 2</text>
    <text x="280" y="310" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="9">BAY 3</text>
    <text x="380" y="310" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="9">WALKWAYS</text>
  </g>
</svg>
