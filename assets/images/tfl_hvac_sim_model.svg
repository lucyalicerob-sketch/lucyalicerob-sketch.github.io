<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hvacBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hvacBg)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="760" height="460" rx="10" fill="#182234" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="20" y="20" width="760" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="45" y="52" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">NEW SIMULATOR BUILDING — THERMAL &amp; HVAC LOAD MODEL</text>
  <rect x="620" y="34" width="140" height="26" rx="4" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1"/>
  <text x="632" y="51" fill="#38bdf8" font-family="'Space Mono', monospace" font-size="10" font-weight="700">THERMAL / E&amp;M</text>

  <!-- Left: Building Envelope & Heat Flow Schematic -->
  <g transform="translate(45, 95)">
    <rect x="0" y="0" width="280" height="350" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="18" y="26" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Thermodynamic Envelope Balance</text>
    <text x="18" y="44" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="9">STEADY-STATE &amp; DYNAMIC LOADS</text>

    <!-- Isometric/2D Building Outline -->
    <rect x="30" y="70" width="220" height="150" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    
    <!-- Solar Gain Arrow (Top-Right) -->
    <path d="M 230,45 L 190,80" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="145" y="45" fill="#f59e0b" font-family="'Space Mono', monospace" font-size="9">SOLAR GAIN (Q_sol)</text>

    <!-- Internal Heat Gains (Simulators + Occupants) -->
    <rect x="50" y="120" width="80" height="70" rx="4" fill="#334155" stroke="#38bdf8"/>
    <text x="56" y="145" fill="#38bdf8" font-family="'Space Mono', monospace" font-size="8">TRAIN SIM</text>
    <text x="56" y="160" fill="#38bdf8" font-family="'Space Mono', monospace" font-size="8">SERVERS</text>
    <text x="56" y="175" fill="#f59e0b" font-family="'Space Mono', monospace" font-size="8">+4.5 kW HEAT</text>

    <rect x="150" y="120" width="80" height="70" rx="4" fill="#334155" stroke="#10b981"/>
    <text x="156" y="145" fill="#10b981" font-family="'Space Mono', monospace" font-size="8">OCCUPANCY</text>
    <text x="156" y="160" fill="#10b981" font-family="'Space Mono', monospace" font-size="8">&amp; LIGHTING</text>
    <text x="156" y="175" fill="#10b981" font-family="'Space Mono', monospace" font-size="8">+1.8 kW SENSIBLE</text>

    <!-- Transmission Loss Arrow (Winter) -->
    <text x="25" y="245" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="9">ENVELOPE U-VALUES:</text>
    <text x="25" y="265" fill="#cbd5e1" font-family="'Space Mono', monospace" font-size="9">• WALLS: 0.18 W/m²K</text>
    <text x="25" y="282" fill="#cbd5e1" font-family="'Space Mono', monospace" font-size="9">• ROOF: 0.14 W/m²K</text>
    <text x="25" y="299" fill="#cbd5e1" font-family="'Space Mono', monospace" font-size="9">• GLAZING: 1.20 W/m²K</text>
    <text x="25" y="322" fill="#38bdf8" font-family="'Space Mono', monospace" font-size="9">VENTILATION: 10 L/s/person</text>
  </g>

  <!-- Right: Heating vs Cooling Load Curves Across Seasons -->
  <g transform="translate(345, 95)">
    <rect x="0" y="0" width="410" height="350" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="26" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Seasonal Heating &amp; Cooling Demand Profiles</text>
    <text x="20" y="44" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="9">HVAC CAPEX &amp; OPEX OPTIMIZATION</text>

    <!-- Axes -->
    <line x1="40" y1="270" x2="380" y2="270" stroke="#475569" stroke-width="1"/>
    <line x1="40" y1="70" x2="40" y2="270" stroke="#475569" stroke-width="1"/>

    <!-- Cooling Curve (Summer Peak) -->
    <path d="M 40,250 Q 120,240 210,100 T 380,240" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="175" y="90" fill="#38bdf8" font-family="'Space Mono', monospace" font-size="9" font-weight="700">PEAK COOLING: 24.6 kW (JULY)</text>

    <!-- Heating Curve (Winter Peak) -->
    <path d="M 40,120 Q 120,220 210,260 T 380,140" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="45" y="110" fill="#f59e0b" font-family="'Space Mono', monospace" font-size="9" font-weight="700">PEAK HEATING: 18.2 kW (JAN)</text>

    <!-- Month Labels -->
    <text x="40" y="290" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="8">JAN</text>
    <text x="90" y="290" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="8">MAR</text>
    <text x="150" y="290" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="8">MAY</text>
    <text x="210" y="290" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="8">JUL</text>
    <text x="270" y="290" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="8">SEP</text>
    <text x="330" y="290" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="8">NOV</text>

    <!-- Bottom KPI Summary -->
    <rect x="20" y="305" width="370" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="325" fill="#10b981" font-family="'Space Mono', monospace" font-size="9">✓ SIMULATOR RUNTIME COMFORT: 21°C ± 1°C MAINTAINED</text>
  </g>
</svg>
