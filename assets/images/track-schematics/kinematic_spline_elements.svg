<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <linearGradient id="splineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c25e2e"/>
      <stop offset="50%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#16a085"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" fill="transparent"/>

  <!-- ====================================================================
       ELEMENT 1: EULER CLOTHOID INVERSION ENTRY (LINEAR CURVATURE TRANSITION)
       ==================================================================== -->
  <g transform="translate(40, 20)">
    <rect x="0" y="0" width="380" height="180" rx="8" fill="rgba(244, 237, 226, 0.4)" stroke="#d6c7b6" stroke-width="1.2"/>
    <text x="16" y="24" fill="#c25e2e" font-family="'Space Mono', monospace" font-size="10" font-weight="700">01 // EULER CLOTHOID TRANSITION</text>
    <text x="16" y="38" fill="#857b70" font-family="'Space Mono', monospace" font-size="8">CURVATURE: κ(s) = A² · s (JERK REDUCTION)</text>

    <!-- Clothoid Path -->
    <path d="M 20,140 C 120,140 180,135 240,90 C 280,55 310,20 350,15" fill="none" stroke="url(#splineGrad)" stroke-width="3.5"/>
    
    <!-- Cross Ties along spline -->
    <g stroke="#968370" stroke-width="1.5">
      <line x1="50" y1="130" x2="50" y2="150"/>
      <line x1="100" y1="130" x2="100" y2="150"/>
      <line x1="150" y1="128" x2="150" y2="148"/>
      <line x1="200" y1="115" x2="212" y2="132"/>
      <line x1="245" y1="80" x2="260" y2="95"/>
      <line x1="290" y1="40" x2="305" y2="52"/>
    </g>

    <!-- Normal Force Vectors (F_N) -->
    <path d="M 210,125 L 210,95" stroke="#e04733" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="215" y="105" fill="#e04733" font-family="'Space Mono', monospace" font-size="8" font-weight="700">F_N = 3.8G</text>

    <!-- Inflection Datum Callout -->
    <circle cx="20" cy="140" r="3" fill="#c25e2e"/>
    <text x="20" y="160" fill="#544b44" font-family="'Space Mono', monospace" font-size="8">ENTRY: κ = 0</text>
    
    <circle cx="350" cy="15" r="3" fill="#16a085"/>
    <text x="270" y="15" fill="#16a085" font-family="'Space Mono', monospace" font-size="8">APEX: κ_max</text>
  </g>

  <!-- ====================================================================
       ELEMENT 2: HEARTLINED ZERO-G ROLL (ROTATION AROUND RIDER CHEST)
       ==================================================================== -->
  <g transform="translate(460, 20)">
    <rect x="0" y="0" width="380" height="180" rx="8" fill="rgba(244, 237, 226, 0.4)" stroke="#d6c7b6" stroke-width="1.2"/>
    <text x="16" y="24" fill="#16a085" font-family="'Space Mono', monospace" font-size="10" font-weight="700">02 // HEARTLINE ROLL KINEMATICS</text>
    <text x="16" y="38" fill="#857b70" font-family="'Space Mono', monospace" font-size="8">AXIS: PARABOLIC DISPLACEMENT (0.0G WEIGHTLESSNESS)</text>

    <!-- Theoretical Rider Heartline (Straight Trajectory) -->
    <line x1="20" y1="90" x2="360" y2="90" stroke="#968370" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="20" y="80" fill="#968370" font-family="'Space Mono', monospace" font-size="8">RIDER HEARTLINE DATUM (Z_0)</text>

    <!-- Orbiting Tubular Rail Splines (Twisting around Heartline) -->
    <path d="M 20,120 Q 100,120 180,90 T 340,60" fill="none" stroke="#c25e2e" stroke-width="2.5"/>
    <path d="M 20,60 Q 100,60 180,90 T 340,120" fill="none" stroke="#2980b9" stroke-width="2.5"/>

    <!-- Heartline Offset Vector -->
    <line x1="180" y1="60" x2="180" y2="120" stroke="#f39c12" stroke-width="1.5"/>
    <circle cx="180" cy="90" r="4" fill="#f39c12"/>
    <text x="190" y="94" fill="#f39c12" font-family="'Space Mono', monospace" font-size="8" font-weight="700">OFFSET: 1.10m</text>

    <text x="20" y="160" fill="#544b44" font-family="'Space Mono', monospace" font-size="8">ROLL VELOCITY: dθ/dt = 180°/s</text>
  </g>
</svg>
