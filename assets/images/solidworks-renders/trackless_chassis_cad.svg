<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dwgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="solidMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#dwgBg)"/>

  <!-- Technical Drawing Border & Title Block -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="520" y="410" width="260" height="70" fill="rgba(15,23,42,0.9)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <text x="530" y="430" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">SOLIDWORKS CAD // PACKAGING</text>
  <text x="530" y="448" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">TRACKLESS RIDE VEHICLE CHASSIS</text>
  <text x="530" y="468" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">DWG NO: AGV-2024-001 | REV: C</text>

  <!-- Top-Down Chassis Layout Grid -->
  <g transform="translate(60, 50)">
    <!-- Structural Chassis Perimeter (Aluminum Plate & Weldment) -->
    <rect x="40" y="40" width="380" height="280" rx="30" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <rect x="55" y="55" width="350" height="250" rx="20" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Center Battery & Controller Enclosure (Low-CG) -->
    <rect x="150" y="110" width="160" height="140" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="165" y="175" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">48V LFP PACK &amp; PLC</text>
    <text x="175" y="195" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">(LOW-CG DATUM)</text>

    <!-- Diagonally Opposed Steer-Drive Pod 1 (Top-Left) -->
    <g transform="translate(60, 60)">
      <rect x="0" y="0" width="50" height="50" rx="8" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="25" cy="25" r="16" fill="#f59e0b"/>
      <line x1="25" y1="5" x2="25" y2="45" stroke="#0c111c" stroke-width="3"/>
      <text x="-15" y="-10" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">DRIVE POD A (STEER)</text>
    </g>

    <!-- Diagonally Opposed Steer-Drive Pod 2 (Bottom-Right) -->
    <g transform="translate(350, 250)">
      <rect x="0" y="0" width="50" height="50" rx="8" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="25" cy="25" r="16" fill="#f59e0b"/>
      <line x1="5" y1="25" x2="45" y2="25" stroke="#0c111c" stroke-width="3"/>
      <text x="-40" y="65" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">DRIVE POD B (STEER)</text>
    </g>

    <!-- Passive Stabilizer Casters (Top-Right & Bottom-Left) -->
    <circle cx="375" cy="85" r="18" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="85" cy="275" r="18" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>

    <!-- Optical Navigation Sensor Envelopes (Front/Rear) -->
    <rect x="200" y="32" width="60" height="16" rx="4" fill="#10b981" stroke="#f8fafc"/>
    <text x="180" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">OPTICAL SENSOR (FWD)</text>

    <!-- Dimension Lines -->
    <g stroke="#94a3b8" stroke-width="1">
      <!-- Width Dimension -->
      <line x1="40" y1="345" x2="420" y2="345"/>
      <line x1="40" y1="335" x2="40" y2="355"/>
      <line x1="420" y1="335" x2="420" y2="355"/>
      <text x="210" y="362" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">1200.00 mm (OVERALL CHASSIS WIDTH)</text>

      <!-- Length Dimension -->
      <line x1="445" y1="40" x2="445" y2="320"/>
      <line x1="435" y1="40" x2="455" y2="40"/>
      <line x1="435" y1="320" x2="455" y2="320"/>
      <text x="465" y="185" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" transform="rotate(90,465,185)" text-anchor="middle">1600.00 mm (CHASSIS LENGTH)</text>
    </g>
  </g>
</svg>
