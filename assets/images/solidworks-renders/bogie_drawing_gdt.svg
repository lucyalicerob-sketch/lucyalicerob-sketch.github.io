<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dwgBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#dwgBg2)"/>

  <!-- Technical Drawing Border & Title Block -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="520" y="410" width="260" height="70" fill="rgba(15,23,42,0.9)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <text x="530" y="430" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">SOLIDWORKS GD&amp;T DRAWING</text>
  <text x="530" y="448" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">3-WHEEL BOGIE CARRIER</text>
  <text x="530" y="468" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">ASME Y14.5-2018 | MAT: 7075-T6 AL</text>

  <!-- Technical Drawing Section Views -->
  <g transform="translate(60, 40)">
    <!-- Main Machined C-Frame Bogie Carrier -->
    <path d="M 60,60 L 260,60 L 260,280 L 60,280 L 60,220 L 180,220 L 180,120 L 60,120 Z" 
          fill="#1e293b" stroke="#f8fafc" stroke-width="2.5"/>

    <!-- Center Clevis Bore for Spherical Bearing -->
    <circle cx="210" cy="170" r="32" fill="#0c111c" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="210" cy="170" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Precision Axle Bores (Road, Guide, Upstop) -->
    <circle cx="100" cy="90" r="16" fill="#0c111c" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="100" cy="250" r="16" fill="#0c111c" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="140" cy="170" r="14" fill="#0c111c" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- GD&T Feature Control Frames -->
    <!-- Frame 1: Concentricity on Bearing Bore -->
    <g transform="translate(300, 130)">
      <rect x="0" y="0" width="160" height="30" fill="#0f172a" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="30" y1="0" x2="30" y2="30" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="110" y1="0" x2="110" y2="30" stroke="#f8fafc" stroke-width="1.5"/>
      <text x="10" y="20" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="14">◎</text>
      <text x="40" y="20" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">⌀ 0.015</text>
      <text x="125" y="20" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12">A</text>
      <line x1="0" y1="15" x2="-58" y2="40" stroke="#f8fafc" stroke-width="1"/>
    </g>

    <!-- Frame 2: Perpendicularity on Axle Mounts -->
    <g transform="translate(300, 230)">
      <rect x="0" y="0" width="160" height="30" fill="#0f172a" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="30" y1="0" x2="30" y2="30" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="110" y1="0" x2="110" y2="30" stroke="#f8fafc" stroke-width="1.5"/>
      <text x="10" y="20" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="14">⊥</text>
      <text x="40" y="20" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">⌀ 0.020</text>
      <text x="125" y="20" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12">B</text>
      <line x1="0" y1="15" x2="-184" y2="20" stroke="#f8fafc" stroke-width="1"/>
    </g>

    <!-- Annotations & Notes -->
    <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">
      <text x="60" y="320" fill="#f8fafc" font-weight="bold">GENERAL NOTES:</text>
      <text x="60" y="338">1. UNLESS OTHERWISE SPECIFIED, ALL DIMENSIONS ARE IN MILLIMETRES [mm].</text>
      <text x="60" y="354">2. SURFACE FINISH Ra 0.8 µm ON ALL BEARING JOURNAL BORES.</text>
      <text x="60" y="370">3. HARD ANODIZE MIL-A-8625 TYPE III CLASS 2 (50 µm COATING THICKNESS).</text>
    </g>
  </g>
</svg>
