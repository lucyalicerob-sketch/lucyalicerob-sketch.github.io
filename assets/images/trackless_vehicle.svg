<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#182338"/>
    </linearGradient>
    <linearGradient id="metalChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(0,242,254,0.2)"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#cadGrid)"/>

  <!-- Blueprint Crosshairs & Grid Coordinate Labels -->
  <text x="30" y="40" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">SOLIDWORKS CAD // SYSTEM: TRACKLESS RIDE AGV</text>
  <text x="620" y="40" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">KINEMATICS: DUAL STEER-DRIVE</text>
  <line x1="30" y1="50" x2="770" y2="50" stroke="rgba(0,242,254,0.2)" stroke-width="1"/>

  <!-- Trajectory Path Lines (Floor Optical Tracking) -->
  <path d="M 120 420 C 220 420, 260 340, 400 340 C 540 340, 600 440, 700 380" fill="none" stroke="#00f2fe" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="400" cy="340" r="6" fill="#00f2fe"/>
  <text x="415" y="345" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">INSTANTANEOUS CENTER OF ROTATION (ICR)</text>

  <!-- 3D Orthographic Chassis Base -->
  <g transform="translate(180, 110)">
    <!-- Chassis Main Frame -->
    <polygon points="120,40 380,40 440,180 60,180" fill="url(#metalChassis)" stroke="#00f2fe" stroke-width="2"/>
    <polygon points="140,60 360,60 400,160 100,160" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Drive Pod 1 (Front Left Steerable Unit) -->
    <g transform="translate(110, 50)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
      <rect x="-8" y="-35" width="16" height="70" rx="4" fill="#38bdf8" opacity="0.85"/>
      <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
      <path d="M -35 0 A 35 35 0 0 1 35 0" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="-40" y="-45" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">STEER POD α1</text>
    </g>

    <!-- Drive Pod 2 (Rear Right Steerable Unit) -->
    <g transform="translate(390, 170)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
      <rect x="-8" y="-35" width="16" height="70" rx="4" fill="#38bdf8" opacity="0.85"/>
      <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
      <path d="M -35 0 A 35 35 0 0 1 35 0" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="10" y="50" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">STEER POD α2</text>
    </g>

    <!-- Passive Spring Casters -->
    <g transform="translate(370, 50)">
      <circle cx="0" cy="0" r="16" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#94a3b8"/>
    </g>
    <g transform="translate(80, 170)">
      <circle cx="0" cy="0" r="16" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#94a3b8"/>
    </g>

    <!-- Center Payload / Battery & Controller Deck -->
    <rect x="180" y="80" width="140" height="60" rx="6" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="200" y="105" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12">VEHICLE CONTROLLER</text>
    <text x="210" y="125" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">ODOMETRY &amp; LPS SENSORS</text>
  </g>

  <!-- Technical Dimension Callouts -->
  <line x1="160" y1="340" x2="160" y2="400" stroke="#94a3b8" stroke-width="1"/>
  <line x1="640" y1="340" x2="640" y2="400" stroke="#94a3b8" stroke-width="1"/>
  <line x1="160" y1="390" x2="640" y2="390" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="350" y="380" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">WHEELBASE = 1450 mm | TRACK = 1100 mm</text>

  <!-- Status / Tag Badge -->
  <rect x="30" y="445" width="220" height="28" rx="4" fill="rgba(0,242,254,0.1)" stroke="#00f2fe" stroke-width="1"/>
  <text x="40" y="463" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11">✓ DUAL DRIVE KINEMATICS VERIFIED</text>
</svg>
