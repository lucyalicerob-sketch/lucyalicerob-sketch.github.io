<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111c"/>
      <stop offset="50%" stop-color="#14202b"/>
      <stop offset="100%" stop-color="#0c111c"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)"/>

  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Header -->
  <rect x="30" y="24" width="740" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="50" cy="44" r="6" fill="#00C4C8"/>
  <text x="68" y="49" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">ENGINEERING INTERNSHIP FIELD LOG // ROLLING STOCK OVERHAUL</text>
  <text x="560" y="49" fill="#00C4C8" font-family="'JetBrains Mono', monospace" font-size="11">TfL DLR BECKTON DEPOT</text>

  <!-- Heavy Rail Bogie Assembly Diagram -->
  <g transform="translate(100, 110)">
    <!-- Steel Bogie Frame (H-Frame) -->
    <rect x="40" y="100" width="520" height="44" rx="8" fill="#1e293b" stroke="#00C4C8" stroke-width="2"/>
    <rect x="250" y="40" width="100" height="160" rx="6" fill="#334155" stroke="#00C4C8" stroke-width="1.5"/>

    <!-- Dual Wheelsets (Left & Right) -->
    <!-- Left Wheel -->
    <circle cx="110" cy="180" r="54" fill="url(#wheelGrad)" stroke="#f8fafc" stroke-width="2.5"/>
    <circle cx="110" cy="180" r="30" fill="#0c111c" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="110" cy="180" r="12" fill="#00C4C8"/>

    <!-- Right Wheel -->
    <circle cx="490" cy="180" r="54" fill="url(#wheelGrad)" stroke="#f8fafc" stroke-width="2.5"/>
    <circle cx="490" cy="180" r="30" fill="#0c111c" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="490" cy="180" r="12" fill="#00C4C8"/>

    <!-- Running Steel Rail Track -->
    <line x1="0" y1="234" x2="600" y2="234" stroke="#f59e0b" stroke-width="8"/>
    <line x1="0" y1="242" x2="600" y2="242" stroke="#64748b" stroke-width="4"/>

    <!-- Pneumatic Brake Caliper Assembly -->
    <rect x="160" y="140" width="40" height="60" rx="4" fill="#ef4444" stroke="#f8fafc" stroke-width="1.5"/>
    <rect x="400" y="140" width="40" height="60" rx="4" fill="#ef4444" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Secondary Air Spring Suspension (Top) -->
    <ellipse cx="300" cy="40" rx="40" ry="16" fill="#09090b" stroke="#f8fafc" stroke-width="2"/>

    <!-- Callouts -->
    <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">
      <line x1="160" y1="170" x2="160" y2="80" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="80" y="70" fill="#ef4444" font-weight="600">Spring-Applied Fail-Safe Brake Caliper</text>

      <line x1="300" y1="30" x2="300" y2="0" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="210" y="-10" fill="#f8fafc" font-weight="600">Secondary Pneumatic Air Spring</text>

      <line x1="490" y1="180" x2="490" y2="80" stroke="#00C4C8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="440" y="70" fill="#00C4C8" font-weight="600">Wheel Wear Gauge Profiling (P8)</text>
    </g>
  </g>

  <!-- Bottom Caption -->
  <rect x="30" y="425" width="740" height="50" rx="8" fill="rgba(19,26,40,0.9)" stroke="rgba(0,196,200,0.3)"/>
  <text x="50" y="455" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">
    📸 <tspan font-weight="bold">Internship Field Photo:</tspan> Documented B70 bogie overhaul, pneumatic brake shoe wear limits, and axle bearing grease sampling at Beckton Maintenance Facility.
  </text>
</svg>
