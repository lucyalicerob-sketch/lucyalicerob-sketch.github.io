<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111c"/>
      <stop offset="50%" stop-color="#182333"/>
      <stop offset="100%" stop-color="#0c111c"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="copperCoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="24" width="740" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="50" cy="44" r="6" fill="#38bdf8"/>
  <text x="68" y="49" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">FIELD PHOTO // MULTI-LAUNCH COASTER SWITCH TRACK &amp; LSM STATORS</text>
  <text x="590" y="49" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">PHANTASIELAND / TARON</text>

  <!-- Mechanical Switch Track Frame -->
  <g transform="translate(80, 100)">
    <!-- Fixed Support Bed -->
    <rect x="50" y="220" width="540" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="100" cy="240" r="10" fill="#f59e0b"/>
    <circle cx="320" cy="240" r="10" fill="#f59e0b"/>
    <circle cx="540" cy="240" r="10" fill="#f59e0b"/>

    <!-- Linear Actuator Arm -->
    <rect x="180" y="190" width="280" height="24" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="300" y="180" width="40" height="44" rx="4" fill="#f59e0b"/>

    <!-- Movable Track Section (Dual Rails) -->
    <path d="M 60,60 L 580,60" stroke="#94a3b8" stroke-width="20" stroke-linecap="round"/>
    <path d="M 60,140 L 580,140" stroke="#94a3b8" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Cross Ties -->
    <line x1="120" y1="50" x2="120" y2="150" stroke="#64748b" stroke-width="8"/>
    <line x1="240" y1="50" x2="240" y2="150" stroke="#64748b" stroke-width="8"/>
    <line x1="360" y1="50" x2="360" y2="150" stroke="#64748b" stroke-width="8"/>
    <line x1="480" y1="50" x2="480" y2="150" stroke="#64748b" stroke-width="8"/>

    <!-- LSM Launch Stator Modules (Center) -->
    <g transform="translate(140, 85)">
      <rect x="0" y="0" width="70" height="30" rx="3" fill="url(#copperCoil)" stroke="#f8fafc" stroke-width="1"/>
      <rect x="85" y="0" width="70" height="30" rx="3" fill="url(#copperCoil)" stroke="#f8fafc" stroke-width="1"/>
      <rect x="170" y="0" width="70" height="30" rx="3" fill="url(#copperCoil)" stroke="#f8fafc" stroke-width="1"/>
      <rect x="255" y="0" width="70" height="30" rx="3" fill="url(#copperCoil)" stroke="#f8fafc" stroke-width="1"/>
    </g>

    <!-- Hydraulic / Pneumatic Shot-Pin Lock -->
    <rect x="490" y="170" width="28" height="60" rx="4" fill="#10b981" stroke="#f8fafc" stroke-width="1.5"/>
    <polygon points="504,155 494,170 514,170" fill="#10b981"/>

    <!-- Callouts -->
    <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">
      <line x1="280" y1="85" x2="280" y2="25" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="290" y="25" fill="#f59e0b" font-weight="600">Linear Synchronous Motor (LSM) Stators</text>

      <line x1="510" y1="180" x2="560" y2="180" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="570" y="184" fill="#10b981" font-weight="600">Fail-Safe Locking Shot-Pin</text>

      <line x1="320" y1="210" x2="320" y2="280" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="240" y="295" fill="#38bdf8" font-weight="600">Servo-Driven High Speed Linear Traverse Mechanism</text>
    </g>
  </g>

  <!-- Bottom Caption -->
  <rect x="30" y="425" width="740" height="50" rx="8" fill="rgba(19,26,40,0.9)" stroke="rgba(56,189,248,0.3)"/>
  <text x="50" y="455" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">
    📸 <tspan font-weight="bold">Field Observation:</tspan> Documented 1.8-second high-speed track switch translation, dual shot-pin mechanical interlocks, and LSM stator thermal management.
  </text>
</svg>
