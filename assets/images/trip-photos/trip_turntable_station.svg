<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111c"/>
      <stop offset="50%" stop-color="#191f28"/>
      <stop offset="100%" stop-color="#0c111c"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad4)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Header -->
  <rect x="30" y="24" width="740" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="50" cy="44" r="6" fill="#f59e0b"/>
  <text x="68" y="49" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">FIELD PHOTO // DUAL-LOAD ROTARY TURNTABLE STATION &amp; CAPACITY</text>
  <text x="590" y="49" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">EUROPA-PARK / VOLTRON</text>

  <!-- Rotary Turntable Top View Diagram -->
  <g transform="translate(400, 240)">
    <!-- Base Mounting Frame Outer Ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
    
    <!-- Rotating Table Disc -->
    <circle cx="0" cy="0" r="120" fill="url(#discGrad)" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="0" cy="0" r="40" fill="#0f172a" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="#f59e0b"/>

    <!-- Track Segments on Rotating Disc -->
    <line x1="-120" y1="-25" x2="120" y2="-25" stroke="#f8fafc" stroke-width="8"/>
    <line x1="-120" y1="25" x2="120" y2="25" stroke="#f8fafc" stroke-width="8"/>

    <!-- Fixed Station Track Entry / Exit -->
    <line x1="-220" y1="-25" x2="-130" y2="-25" stroke="#64748b" stroke-width="8"/>
    <line x1="-220" y1="25" x2="-130" y2="25" stroke="#64748b" stroke-width="8"/>
    <text x="-210" y="60" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">STATION PLATFORM 1</text>

    <line x1="130" y1="-25" x2="220" y2="-25" stroke="#64748b" stroke-width="8"/>
    <line x1="130" y1="25" x2="220" y2="25" stroke="#64748b" stroke-width="8"/>
    <text x="140" y="60" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">MAIN LAUNCH TRACK</text>

    <!-- Rotary Motion Arrow -->
    <path d="M -70,-80 A 100 100 0 0 1 70,-80" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5,5"/>
    <polygon points="75,-75 65,-90 85,-85" fill="#f59e0b"/>
    <text x="-50" y="-105" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">90° ROTATION IN 6.5s</text>

    <!-- Shot-Pin Interlocks -->
    <rect x="-135" y="-10" width="16" height="20" rx="3" fill="#10b981" stroke="#f8fafc"/>
    <rect x="119" y="-10" width="16" height="20" rx="3" fill="#10b981" stroke="#f8fafc"/>
  </g>

  <!-- Bottom Caption -->
  <rect x="30" y="425" width="740" height="50" rx="8" fill="rgba(19,26,40,0.9)" stroke="rgba(245,158,11,0.3)"/>
  <text x="50" y="455" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">
    📸 <tspan font-weight="bold">Field Observation:</tspan> Timed 6.5-second indexing rotation and calculated capacity jump from 960 pph to 2,050 pph.
  </text>
</svg>
